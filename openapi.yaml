openapi: 3.0.4
info:
  title: Unix Timestamp Converter
  description: >-
    Unix Timestamp Converter converts Unix timestamps into formatted dates and
    parses ISO 8601 strings back into epoch seconds. Responses break down dates
    into ISO 8601, RFC 2822, simple time strings, individual calendar components
    like year, month and hour, plus the day of the year. Paid plans add the ISO
    week, and an IANA timezone to also get the same moment in local time with
    its UTC offset, abbreviation and daylight saving flag.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/unixtimestamp:
    get:
      summary: Unix Timestamp Converter
      description: >-
        Convert Unix timestamp to human-readable date, optionally in a target
        timezone
      operationId: unixtimestamp
      parameters:
        - name: timestamp
          in: query
          schema:
            type: string
          required: true
          description: Unix timestamp to convert
          example: '1609459200'
        - name: format
          in: query
          schema:
            type: string
          required: false
          description: Timestamp format
          example: seconds
        - name: timezone
          in: query
          schema:
            type: string
          required: false
          description: >-
            IANA timezone (or fixed UTC offset) to also show the moment in,
            returned as a local block
          example: America/New_York
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  timestamp: 1609459200
                  timestamp_format: seconds
                  iso_8601: '2021-01-01T00:00:00.000Z'
                  rfc_2822: Fri, 01 Jan 2021 00:00:00 GMT
                  date: 1/1/2021
                  time: 12:00:00 AM
                  unix_seconds: 1609459200
                  unix_milliseconds: 1609459200000
                  year: 2021
                  month: 1
                  day: 1
                  hour: 0
                  minute: 0
                  second: 0
                  day_of_week: Friday
                  timezone: UTC
                  day_of_year: 1
                  iso_week: 2020-W53
                  local:
                    timezone: America/New_York
                    iso_8601: '2020-12-31T19:00:00-05:00'
                    date: 12/31/2020
                    time: 7:00:00 PM
                    year: 2020
                    month: 12
                    day: 31
                    hour: 19
                    minute: 0
                    second: 0
                    day_of_week: Thursday
                    day_of_year: 366
                    iso_week: 2020-W53
                    utc_offset: '-05:00'
                    utc_offset_seconds: -18000
                    abbreviation: EST
                    is_dst: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
